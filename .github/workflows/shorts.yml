name: Mini Marvels - 4 cinematic Shorts daily
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot: 1 learning, 2 story, 3 habits, 4 nature'
        type: choice
        options: ['1', '2', '3', '4']
        default: '1'
      upload:
        description: Upload to YouTube (otherwise render only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: minimarvels-production
  cancel-in-progress: false
jobs:
  create-short:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: us-central1
      VEO_MODEL: ${{ vars.VEO_MODEL || 'veo-3.1-fast-generate-001' }}
      SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL || 'gemini-2.5-flash' }}
      CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'Telugu and simple English' }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Select slot and create
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_UPLOAD: ${{ inputs.upload }}
        run: |
          python - <<'PY'
          import os, subprocess
          slots = {'0 3 * * *': '1', '0 7 * * *': '2', '0 11 * * *': '3', '0 14 * * *': '4'}
          scheduled = os.environ['GITHUB_EVENT_NAME'] == 'schedule'
          slot = slots[os.environ['EVENT_SCHEDULE']] if scheduled else os.environ['MANUAL_SLOT']
          args = ['python', 'pipeline.py', '--slot', slot]
          if scheduled or os.environ['MANUAL_UPLOAD'] == 'true':
              args.append('--upload')
          subprocess.run(args, check=True)
          PY
      - name: Save videos and generation checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimarvels-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
